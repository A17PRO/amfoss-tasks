<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=divice-width", initial-scale=1.
        <title>
            Crypto Tracker
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>
                $ Crypto Price Tracking
            </h1>
            <p>
                Real-Time cryptocurrency prices and market data
            </p>
        </div>
        <div class="controls">
            <div class="search-containers">
                <input type="text" id="search-input" placeholder="Search for a cryptocurrency..." id="searchInput">
                <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 14.23 14.23l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6emedium">
                    </path>
                </svg>
            </div>
            <button class="last-updated" id="lastUpdated"></button>

            <div class="loading-grid" id="loading-grid"></div>

            <div class="loading-spinner"></div>
            <p>Loading Cryptocurrency data...</p>
        </div>
        <div class="error" id="error">
            <h3>Failed to load Cryptocurrency data</h3>
            <p>Unable to fetch cryptocurrency data. Please check your connection.</p>
        </div>
        <div class="crypto-grid" id="crypto-grid"></div>
        <script src="script.js"></script>
    </body>
</html>
